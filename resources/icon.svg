<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#4A90E2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A90E2" flood-opacity="0.15"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle (light) -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Browser window frame -->
  <rect x="48" y="56" width="160" height="120" rx="12" ry="12"
        fill="#FFFFFF" stroke="#4A90E2" stroke-width="3"/>

  <!-- Browser title bar -->
  <rect x="48" y="56" width="160" height="24" rx="12" ry="12"
        fill="url(#blueGrad)"/>
  <rect x="48" y="68" width="160" height="12"
        fill="url(#blueGrad)"/>

  <!-- Window control dots -->
  <circle cx="64" cy="68" r="4" fill="#FF5F57"/>
  <circle cx="78" cy="68" r="4" fill="#FEBC2E"/>
  <circle cx="92" cy="68" r="4" fill="#28C840"/>

  <!-- Browser address bar -->
  <rect x="62" y="90" width="132" height="16" rx="8" ry="8"
        fill="#EEF2F7" stroke="#D0D8E4" stroke-width="1.5"/>

  <!-- AI sparkle icon in address bar -->
  <g transform="translate(70, 94)" filter="url(#glow)">
    <path d="M8 0 L9.5 6.5 L16 8 L9.5 9.5 L8 16 L6.5 9.5 L0 8 L6.5 6.5 Z"
          fill="url(#aiGrad)"/>
  </g>
  <text x="86" y="102" font-family="Arial" font-size="7" fill="#888888">ai.local</text>

  <!-- Web content lines (simulated page) -->
  <rect x="62" y="114" width="48" height="4" rx="2" fill="#D0D8E4"/>
  <rect x="62" y="122" width="80" height="4" rx="2" fill="#D0D8E4"/>
  <rect x="62" y="130" width="64" height="4" rx="2" fill="#D0D8E4"/>
  <rect x="62" y="138" width="72" height="4" rx="2" fill="#D0D8E4"/>
  <rect x="62" y="146" width="56" height="4" rx="2" fill="#D0D8E4"/>
  <rect x="62" y="154" width="76" height="4" rx="2" fill="#D0D8E4"/>

  <!-- AI brain / neural network overlay (bottom right) -->
  <g transform="translate(140, 130)">
    <!-- Neural network nodes -->
    <circle cx="40" cy="10" r="8" fill="url(#aiGrad)" opacity="0.9"/>
    <circle cx="20" cy="35" r="6" fill="url(#aiGrad)" opacity="0.7"/>
    <circle cx="55" cy="35" r="6" fill="url(#aiGrad)" opacity="0.7"/>
    <circle cx="10" cy="60" r="5" fill="url(#aiGrad)" opacity="0.5"/>
    <circle cx="40" cy="60" r="5" fill="url(#aiGrad)" opacity="0.5"/>
    <circle cx="65" cy="60" r="5" fill="url(#aiGrad)" opacity="0.5"/>

    <!-- Connection lines -->
    <line x1="40" y1="18" x2="20" y2="29" stroke="#4A90E2" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="18" x2="55" y2="29" stroke="#4A90E2" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="41" x2="10" y2="55" stroke="#4A90E2" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="41" x2="40" y2="55" stroke="#4A90E2" stroke-width="1.5" opacity="0.5"/>
    <line x1="55" y1="41" x2="40" y2="55" stroke="#4A90E2" stroke-width="1.5" opacity="0.5"/>
    <line x1="55" y1="41" x2="65" y2="55" stroke="#4A90E2" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- "AI" text badge -->
  <rect x="176" y="148" width="32" height="20" rx="6" ry="6"
        fill="url(#blueGrad)"/>
  <text x="192" y="162" font-family="Arial, sans-serif" font-size="11"
        font-weight="bold" fill="#FFFFFF" text-anchor="middle">AI</text>

  <!-- Bottom label -->
  <text x="128" y="205" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="13" font-weight="600" fill="#4A90E2" text-anchor="middle"
        letter-spacing="2">本地AI智能浏览器</text>
</svg>